# TDnetの「株主優待」開示を検知してIssueを起票する。
# 平日21:30 JSTに前日+当日分をチェック(過去の開示実績を確認したところ最遅でも20:00頃だったため、
# 1.5時間の余裕を見て21:30に前倒しし、後続の自動処理・X下書き作成を早める)。
name: Check TDnet yutai disclosures

on:
  schedule:
    - cron: '30 12 * * 1-5' # 平日21:30 JST
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYYMMDD (省略時は前日+当日JST)'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install PDF text extractor
        run: npm install pdf-parse@1.1.1 --no-save

      - name: Detect disclosures and create issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-tdnet.js ${{ inputs.date }}

      - name: Commit seen list
        run: |
          if git diff --quiet tdnet-seen.json; then
            echo "処理済みリストに変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tdnet-seen.json
          git commit -m "tdnet-seen: 処理済み開示を記録"
          git push
